<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {

</head> <body> <div id="startScreen"> <h1>SNES Emulator</h1> <p>Select an SNES ROM from your Chromebook.</p>
<button id="romButton">Choose SNES ROM</button>

<input
    id="romInput"
    type="file"
    accept=".sfc,.smc,.fig,.swc,.zip"
>

</div> <div id="game"></div> <script> const romButton = document.getElementById("romButton"); const romInput = document.getElementById("romInput"); romButton.addEventListener("click", () => { romInput.click(); }); romInput.addEventListener("change", () => { const file = romInput.files[0]; if (!file) { return; } /* * Create a temporary local URL for the selected ROM. * The ROM remains on the Chromebook. */ const romURL = URL.createObjectURL(file); /* * Tell EmulatorJS which game to load. */ window.EJS_gameUrl = romURL; /* * Hide the start screen. */ document.getElementById("startScreen").style.display = "none"; /* * Start EmulatorJS. */ if (window.EJS_start) { window.EJS_start(); } }); </script> <script> EJS_player = "#game"; EJS_core = "snes"; EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/"; EJS_gameUrl = ""; EJS_startOnLoaded = false; </script> <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script> </body> </html>
