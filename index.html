<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;

        display: none;

</head> <body> <div id="startScreen"> <h1>SNES Emulator</h1>
<p>
    Choose an SNES ROM from your Chromebook.
    <br>
    The ROM is processed locally in your browser.
</p>

<button id="romButton">Choose SNES ROM</button>

<input
    id="romInput"
    type="file"
    accept=".sfc,.smc,.fig,.swc,.zip"
>

</div> <div id="game"></div> <script> let selectedROM = null; const romButton = document.getElementById("romButton"); const romInput = document.getElementById("romInput"); const startScreen = document.getElementById("startScreen"); romButton.addEventListener("click", function () { romInput.click(); }); romInput.addEventListener("change", async function () { const file = romInput.files[0]; if (!file) { return; } romButton.disabled = true; romButton.textContent = "Loading ROM..."; try { /* * Read the ROM into memory first. */ const data = await file.arrayBuffer(); /* * Make a Blob containing the ROM data. */ const blob = new Blob( [data], { type: "application/octet-stream" } ); /* * Create a temporary URL for the ROM. */ selectedROM = URL.createObjectURL(blob); /* * Tell EmulatorJS to use the local ROM. */ window.EJS_gameUrl = selectedROM; /* * Hide the file-selection screen. */ startScreen.style.display = "none"; /* * Start the emulator. */ if (window.EJS_start) { window.EJS_start(); } } catch (error) { console.error("ROM loading error:", error); romButton.disabled = false; romButton.textContent = "Choose SNES ROM"; alert( "The ROM could not be loaded. " + "Check the browser console for details." ); } }); </script> <script> EJS_player = "#game"; EJS_core = "snes"; EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/"; EJS_gameUrl = ""; EJS_startOnLoaded = false; </script> <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script> </body> </html>
